<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipo | UNICIT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles/reset.css" />
    <link rel="stylesheet" href="../css/styles/variables.css" />
    <link rel="stylesheet" href="../css/styles/tipografia.css" />
    <link rel="stylesheet" href="../css/styles/global.css" />
    <link rel="stylesheet" href="../css/styles/utilities.css" />
    <link rel="stylesheet" href="../css/styles/componenetes.css" />
    <link rel="stylesheet" href="../css/landing.css" />
  </head>
  <body>
    <header class="container flex" style="justify-content: space-between; align-items: center; padding: 2rem 0;">
      <h2 style="color: var(--color-text); margin: 0;">UNICIT Devs</h2>
      <button id="logoutBtn" class="btn btn-secondary">Cerrar sesión</button>
    </header>

    <main class="container section">
      <div class="text-center">
        <h1>Conoce a nuestro equipo</h1>
        <p class="mt-2">Desliza el cursor sobre las tarjetas para ver más detalles.</p>
      </div>

      <div id="filterContainer" class="mt-4"></div>

      <div id="usersGrid" class="cards-grid mt-6">
        <p class="text-center w-full" id="loadingState">Cargando integrantes...</p>
      </div>
    </main>

    <script>
      (async function validateSession() {
        const token = sessionStorage.getItem("authToken");
        const storedUser = sessionStorage.getItem("authUser");

        if (!token || !storedUser) {
          window.location.replace("index.html");
          return;
        }

        try {
          const res = await fetch("https://dummyjson.com/auth/me", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!res.ok) throw new Error("Token inválido o expirado");

          const current = await res.json();
          const local = JSON.parse(storedUser);

          if (current.id !== local.id || current.username !== local.username) {
            throw new Error("Los datos del usuario no coinciden");
          }
        } catch (err) {
          sessionStorage.removeItem("authToken");
          sessionStorage.removeItem("authUser");
          window.location.replace("index.html");
        }
      })();
    </script>
    
    <script src="../js/landing.js"></script>
    <script src="../js/filtro.js"></script>
  </body>
</html>
